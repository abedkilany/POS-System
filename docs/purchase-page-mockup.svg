  <text x="1450" y="862" text-anchor="end" class="text" font-size="18">المورد: شركة المورد</text><text x="800" y="862" text-anchor="middle" class="text" font-size="18">العناصر: 2</text><text x="100" y="862" class="text" font-size="21" font-weight="bold">الإجمالي: $0.00</text>

  <rect fill="#f8fbff" stroke="#c5d0db" stroke-width="2" x="0" y="918" width="1600" height="82"/>
  <rect class="primary" x="48" y="936" width="150" height="48" rx="24"/><text x="123" y="967" text-anchor="middle" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="18" font-weight="bold">حفظ　▣</text>
  <text x="220" y="967" class="text" font-family="Tahoma,Arial,sans-serif" font-size="18">إلغاء</text><text x="1510" y="967" text-anchor="end" class="text" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="bold">الإجمالي: $0.00</text>
