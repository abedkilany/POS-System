    <rect x="224" y="615" width="145" height="115" rx="16"/><text class="t" x="297" y="665" text-anchor="middle">دوار شمس خل</text><text class="m" x="297" y="700" text-anchor="middle" font-size="15">$0.00</text>
    <rect x="386" y="615" width="145" height="115" rx="16"/><text class="t" x="459" y="665" text-anchor="middle">دوار شمس صيني</text><text class="m" x="459" y="700" text-anchor="middle" font-size="15">$0.00</text>
