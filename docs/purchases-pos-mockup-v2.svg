  <rect class="panel" x="594" y="330" width="974" height="560" rx="18"/>
  <rect x="618" y="352" width="926" height="76" rx="15" fill="#d8edfc" stroke="#a9cee8" stroke-width="2"/>
  <rect class="primary" x="1270" y="368" width="170" height="44" rx="22"/><text x="1355" y="396" text-anchor="middle" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="17" font-weight="bold">إضافة للسلة　🛒</text>
  <rect class="field" x="720" y="364" width="525" height="52" rx="13"/><text class="m" x="1215" y="397" text-anchor="end" font-size="17">استخدم قارئ الباركود أو اكتب الكود ثم اضغط Enter</text><text class="t" x="747" y="397" font-size="24">⌕　⌫　⌨</text><text class="t" x="1490" y="397" font-size="26">▦</text>
  <text class="t" x="1510" y="476" text-anchor="end" font-size="22" font-weight="bold">سلة المشتريات</text><rect class="field" x="1390" y="448" width="118" height="42" rx="10"/><text class="t" x="1449" y="475" text-anchor="middle" font-size="16">العناصر: 0</text>
  <rect x="618" y="505" width="926" height="260" rx="15" fill="#f1f4f8"/>
  <text class="m" x="1080" y="645" text-anchor="middle" font-size="18">لم تتم إضافة أي عناصر إلى الفاتورة بعد.</text>
  <text class="m" x="1080" y="680" text-anchor="middle" font-size="15">استخدم شبكة المنتجات أو الباركود لإضافة الأصناف</text>
  <text class="t" x="1510" y="825" text-anchor="end" font-size="17">الإجمالي</text><text class="t" x="1510" y="858" text-anchor="end" font-size="30" font-weight="bold">$0.00</text>
  <rect class="primary" x="650" y="816" width="175" height="50" rx="25"/><text x="737" y="848" text-anchor="middle" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="17" font-weight="bold">متابعة الدفع　▣</text>
