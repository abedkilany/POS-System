    <rect x="224" y="480" width="145" height="115" rx="16"/><text class="t" x="297" y="530" text-anchor="middle">بزر أبيض 0.13</text><text class="m" x="297" y="565" text-anchor="middle" font-size="15">$0.00</text>
    <rect x="386" y="480" width="145" height="115" rx="16"/><text class="t" x="459" y="530" text-anchor="middle">بزر أبيض 0.3</text><text class="m" x="459" y="565" text-anchor="middle" font-size="15">$0.00</text>
