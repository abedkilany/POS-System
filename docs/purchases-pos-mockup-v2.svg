<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs><style>
    .bg{fill:#f5f8fc}.panel{fill:#eef3f9;stroke:#dbe3ec;stroke-width:2}.field{fill:#fff;stroke:#b8c7d5;stroke-width:2}.chip{fill:#f9fbfe;stroke:#bdc9d5;stroke-width:2}.tile{fill:#dcecfb;stroke:#a9cee8;stroke-width:2}.blue{fill:#c9e8fb}.primary{fill:#236f95}.t{fill:#202b35;font-family:Tahoma,Arial,sans-serif}.m{fill:#5e6d7a;font-family:Tahoma,Arial,sans-serif}.i{fill:none;stroke:#53616d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <rect class="bg" width="1600" height="950"/>
  <text class="t" x="1515" y="58" text-anchor="end" font-size="30" font-weight="bold">المشتريات • فاتورة شراء جديدة</text>
  <text class="m" x="1515" y="92" text-anchor="end" font-size="17">أنشئ فاتورة شراء، أضف المنتجات، ثم تابع الدفع عند الانتهاء.</text>
