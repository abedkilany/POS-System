    <rect class="chip" x="510" y="126" width="150" height="43" rx="11"/><text x="585" y="154" text-anchor="middle">F8 تركيز التكلفة</text>
    <rect class="chip" x="330" y="126" width="160" height="43" rx="11"/><text x="410" y="154" text-anchor="middle">F4 الاستلام الآن</text>
    <rect class="chip" x="145" y="126" width="165" height="43" rx="11"/><text x="227" y="154" text-anchor="middle">F7 متابعة الدفع</text>
