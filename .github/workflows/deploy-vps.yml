name: Deploy VPS

on:
  workflow_run:
    workflows:
      - Quality checks
    types:
      - completed
    branches:
      - main

concurrency:
  group: deploy-vps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Build web
        run: |
          set -euo pipefail
          APP_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          if [ -z "$APP_VERSION" ]; then
            echo "Could not read app version from pubspec.yaml" >&2
            exit 1
          fi
          flutter --version
          flutter config --enable-web
          flutter pub get
          flutter build web --release --dart-define=APP_VERSION="$APP_VERSION"
          grep -q "$APP_VERSION" build/web/main.dart.js
          printf '{"version":"%s","commit":"%s","builtAt":"%s"}\n' \
            "$APP_VERSION" "$DEPLOY_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > build/web/version.json
          printf '%s\n' "$DEPLOY_SHA" > build/web/.last_build_id

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "VPS_SSH_KNOWN_HOSTS must contain the verified VPS host key." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ventio_deploy_key
          chmod 600 ~/.ssh/ventio_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          KNOWN_HOST_TARGET="$VPS_HOST"
          if [ "${VPS_PORT:-22}" != "22" ]; then
            KNOWN_HOST_TARGET="[$VPS_HOST]:$VPS_PORT"
          fi
          ssh-keygen -F "$KNOWN_HOST_TARGET" -f ~/.ssh/known_hosts >/dev/null

      - name: Upload files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_WEB_DIR: ${{ secrets.VPS_WEB_DIR }}
        run: |
          set -euo pipefail
          api_items=(server_api package.json server.js scripts)
          if [ -f package-lock.json ]; then
            api_items+=(package-lock.json)
          fi
          ssh -i ~/.ssh/ventio_deploy_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_APP_DIR' '$VPS_WEB_DIR'"
          rsync -az --delete -e "ssh -i ~/.ssh/ventio_deploy_key -p ${VPS_PORT:-22}" \
            "${api_items[@]}" \
            "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/"
          rsync -azc --delete -e "ssh -i ~/.ssh/ventio_deploy_key -p ${VPS_PORT:-22}" \
            build/web/ \
            "$VPS_USER@$VPS_HOST:$VPS_WEB_DIR/"

      - name: Restart API
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ventio_deploy_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "VPS_APP_DIR='$VPS_APP_DIR' VPS_HEALTH_URL='$VPS_HEALTH_URL' bash -s" <<'DEPLOY'
          set -euo pipefail

          cd "$VPS_APP_DIR"

          if [ -f package-lock.json ]; then
            npm ci --omit=dev
          else
            npm install --omit=dev
          fi

          pm2 restart ventio-api --update-env
          pm2 save

          if [ -n "${VPS_HEALTH_URL:-}" ]; then
            HEALTH_URL="$VPS_HEALTH_URL"
            case "$HEALTH_URL" in
              */api/health) HEALTH_URL="${HEALTH_URL%/health}/deploy-health" ;;
              */health) HEALTH_URL="${HEALTH_URL%/health}/deploy-health" ;;
            esac
            curl -fsS "$HEALTH_URL" >/dev/null
          fi
          DEPLOY
